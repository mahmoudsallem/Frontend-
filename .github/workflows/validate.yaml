name: Project Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate-project:
    name: Validate Project Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "### Project Validation" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          MISSING=0

          # Required files list
          FILES=(
            "Dockerfile"
            "package.json"
            "package-lock.json"
            "nginx.conf"
            "public/index.html"
            "src/index.js"
            "src/App.js"
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Found: $file"
              echo "| $file | Found |" >> $GITHUB_STEP_SUMMARY
            else
              echo "Missing: $file"
              echo "| $file | Missing |" >> $GITHUB_STEP_SUMMARY
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "::error::Required project files are missing!"
            exit 1
          fi

          echo ""
          echo "All required files present!"

      - name: Validate package.json
        run: |
          echo "Validating package.json structure..."
          if ! node -e "JSON.parse(require('fs').readFileSync('package.json'))"; then
            echo "::error::package.json is not valid JSON"
            exit 1
          fi
          echo "package.json is valid JSON"

      - name: Validate Dockerfile
        run: |
          echo "Validating Dockerfile..."
          if ! grep -q "^FROM" Dockerfile; then
            echo "::error::Dockerfile missing FROM instruction"
            exit 1
          fi
          echo "Dockerfile has valid FROM instruction"

      - name: Validate nginx.conf
        run: |
          echo "Validating nginx.conf syntax..."
          docker run --rm -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t -c /etc/nginx/nginx.conf || {
            echo "::error::nginx.conf has syntax errors"
            exit 1
          }
          echo "nginx.conf syntax is valid"
